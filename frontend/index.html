<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUBA CanFindIT · Malolos City LGU Road Operations Admin System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/config/tailwind.config.js"></script>
  <link rel="stylesheet" href="./css/luba-reference.css" />
  <link rel="stylesheet" href="./assets/leaflet/leaflet.css" />
  <script src="./assets/leaflet/leaflet.js"></script>
  <!-- Supabase Web SDK (PostgreSQL Realtime & Storage - Primary Single Source of Truth) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Require authentication: redirect unauthenticated users to the login page
    if (sessionStorage.getItem('luba_authenticated') !== 'true') {
      window.location.replace('./login.html');
    }

    // Global Fallback SVG for Pothole Evidence Photos
    window.FALLBACK_POTHOLE_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' fill='%23E2E8F0'%3E%3Crect width='400' height='300' fill='%231E3959'/%3E%3Ccircle cx='200' cy='120' r='48' fill='%232E4765'/%3E%3Cpath d='M180 115a8 8 0 0 1 8-8h24a8 8 0 0 1 8 8v16a8 8 0 0 1-8 8h-24a8 8 0 0 1-8-8z' stroke='%238FA3BA' stroke-width='3' fill='none'/%3E%3Ccircle cx='200' cy='123' r='6' stroke='%238FA3BA' stroke-width='2' fill='none'/%3E%3Cpath d='M195 103h10' stroke='%238FA3BA' stroke-width='2' stroke-linecap='round'/%3E%3Ctext x='200' y='210' font-family='sans-serif' font-size='14' font-weight='600' fill='%23CFD9E5' text-anchor='middle'%3EROAD EVIDENCE PHOTO%3C/text%3E%3Ctext x='200' y='232' font-family='sans-serif' font-size='11' fill='%238FA3BA' text-anchor='middle'%3EMalolos City Road Works%3C/text%3E%3C/svg%3E";

    // Global script error listener
    window.addEventListener('error', function(err) {
      console.error('[LUBA Diagnostic Error]', err);
      var vp = document.getElementById('main-viewport');
      if (vp && (!vp.children.length || !vp.innerHTML.trim())) {
        vp.innerHTML = '<div style="margin:24px 0;padding:20px;background:#fef2f2;border:2px solid #ef4444;border-radius:12px;color:#991b1b;font-family:sans-serif;">' +
          '<h3 style="font-weight:bold;margin:0 0 8px 0;font-size:15px;">Script Initialization Notice</h3>' +
          '<p style="margin:0 0 10px 0;font-size:12px;">' + (err.message || 'Error initializing script') + ' at ' + (err.filename || '') + ':' + (err.lineno || '') + '</p>' +
          '<button onclick="location.reload()" style="background:#b91c1c;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;">Reload Page</button>' +
          '</div>';
      }
    });
  </script>
</head>

<body class="bg-luba-canvas text-luba-textPrimary font-sans antialiased h-screen overflow-hidden flex">

  <!-- Shared Component: Fixed Left Sidebar (236px · var(--luba-navy) · Full Height · Non-scrollable Shell) -->
  <aside id="app-sidebar"
    class="luba-sidebar w-sidebar h-screen bg-luba-navy text-white flex flex-col justify-between px-4 py-6 shrink-0 select-none overflow-hidden">
    <!-- Top Branding & LGU Workspace (Fixed, Non-scrollable) -->
    <div class="space-y-6 shrink-0">
      <!-- Brand Logo (Cropped directly from Admin · Operations overview.png) -->
      <div class="px-1 pt-0.5 cursor-pointer" data-screen-jump="1">
        <img src="./assets/luba-logo.png" alt="LUBA CanFindIT" class="h-[52px] w-auto object-contain" />
      </div>

      <!-- LGU Workspace -->
      <div class="px-2 space-y-1">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-luba-sidebarMuted">Malolos City LGU WORKSPACE</p>
        <p class="text-xs font-medium text-luba-sidebarText">Malolos City</p>
      </div>
    </div>

    <!-- Primary Navigation (Only this navigation section is scrollable if vertical space is constrained) -->
    <nav class="my-4 space-y-1.5 overflow-y-auto flex-1 pr-1 luba-nav-scroll" aria-label="Main Navigation">
        <button type="button" data-nav-section="overview" class="luba-nav-btn luba-nav-btn-active">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="overview" class="w-4 h-4 text-luba-cta shrink-0" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
            </svg>
            <span>Overview</span>
          </span>
        </button>

        <button type="button" data-nav-section="reports" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="reports" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none"
              stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" />
              <rect x="9" y="3" width="6" height="4" rx="1" />
              <path d="M9 12h6M9 16h4" />
            </svg>
            <span>Reports</span>
          </span>
          <span id="sidebar-reports-badge" class="text-[11px] font-semibold text-luba-cta">98</span>
        </button>

        <button type="button" data-nav-section="map" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="map" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none" stroke="currentColor"
              stroke-width="1.8" viewBox="0 0 24 24">
              <path
                d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
            <span>Pothole map</span>
          </span>
        </button>

        <button type="button" data-nav-section="users" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="users" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none" stroke="currentColor"
              stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
            </svg>
            <span>Users</span>
          </span>
        </button>

        <button type="button" data-nav-section="teams" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="teams" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none" stroke="currentColor"
              stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M2 18h20M4 18v-5a8 8 0 0116 0v5M10 8V5a2 2 0 014 0v3" />
            </svg>
            <span>Teams</span>
          </span>
        </button>

        <button type="button" data-nav-section="analytics" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="analytics" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none"
              stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M3 3v18h18" />
              <path d="M7 16v-4m5 4V8m5 8v-6" />
            </svg>
            <span>Analytics</span>
          </span>
        </button>

        <button type="button" data-nav-section="settings" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="settings" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none"
              stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <circle cx="9" cy="8" r="2" />
              <circle cx="15" cy="16" r="2" />
              <path d="M4 8h3m4 0h9M4 16h9m4 0h3" />
            </svg>
            <span>Settings</span>
          </span>
        </button>
      </nav>

    <!-- Sidebar Tagline (Fixed at bottom) -->
    <div class="px-2 pt-4 space-y-3 text-[11px] text-luba-sidebarMuted leading-[1.55] shrink-0 border-t border-[#1E3959]/60">
      <p>Built for better roads.<br />One connected workflow from<br />report to verified repair.</p>
    </div>
  </aside>

  <!-- Right Shell Column (Top Header Bar 80px + Scrollable Main Viewport + Footer) -->
  <div id="app-shell-right" class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden bg-luba-canvas">

    <!-- Shared Component: Top Header Bar (80px · var(--luba-surface) · Matches PNGs 1:1 · Non-scrollable Sticky) -->
    <header id="app-topbar"
      class="luba-topbar h-topbar bg-luba-surface border-b border-luba-border px-8 flex items-center justify-between shrink-0 sticky top-0 z-30">
      <div id="topbar-breadcrumb" class="text-[13px] text-luba-textSubtle flex items-center">
        <span>Administration</span>
        <span class="mx-2">/</span>
        <span>Overview</span>
      </div>

      <div class="flex items-center gap-5">
        <span class="text-[13px] text-luba-textSubtle">City of Malolos · PHT</span>

        <button type="button" data-screen-jump="25" aria-label="Notifications"
          class="text-luba-textPrimary hover:text-luba-info transition">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 01-3.46 0" />
          </svg>
        </button>

        <button type="button" data-screen-jump="25"
          class="flex items-center gap-3 text-left hover:opacity-80 transition">
          <div>
            <p id="topbar-admin-name" class="text-[13px] font-bold text-luba-textPrimary leading-tight">Ana Dela Cruz</p>
            <p id="topbar-admin-role" class="text-xs font-semibold text-luba-textPrimary leading-tight mt-0.5">LGU administrator</p>
          </div>
          <svg class="w-3.5 h-3.5 text-luba-textPrimary ml-0.5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Viewport Container: Only Content and Footer Scroll -->
    <div id="app-content-scroll" class="flex-1 overflow-y-auto flex flex-col min-h-0">
      <!-- Main Content Area (1200px max width, 32px horizontal padding matching 1440px PNG frame) -->
      <main id="app-main-container" class="flex-1 max-w-[1204px] w-full mx-auto px-8 pt-7 pb-6">
        <div id="reference-image-panel" class="mb-6 hidden"></div>
        <div id="main-viewport"></div>
      </main>

      <!-- Footer (Matches bottom metadata row in the 26 PNG screens) -->
      <footer id="app-footer"
        class="max-w-[1204px] w-full mx-auto px-8 py-4 flex flex-wrap items-center justify-between gap-2 text-[11px] text-luba-textSubtle shrink-0">
        <span>LUBA canFindIT · City Engineering Office, City of Malolos</span>
        <span id="footer-operational-badge" class="inline-flex items-center gap-1.5 text-luba-success font-medium">
          <span class="w-2 h-2 rounded-full bg-luba-success"></span>
          All systems operational
        </span>
      </footer>
    </div>
  </div>

  <!-- Full-Screen Uploaded PNG Viewer Container -->
  <div id="full-png-stage" class="hidden flex-1 bg-luba-canvas overflow-auto"></div>

  <!-- Modal Portal -->
  <div id="modal-portal"></div>

  <!-- Adaptive Dynamic Module Bootloader with Automatic Path Resolution -->
  <script>
    (function() {
      var pathname = window.location.pathname;
      var jsRoot = './js/';
      if (pathname.includes('/frontend/')) {
        jsRoot = pathname.substring(0, pathname.indexOf('/frontend/') + 10) + 'js/';
      }

      var s = document.createElement('script');
      s.type = 'module';
      s.src = jsRoot + 'app.js?v=' + Date.now();
      s.onerror = function(err) {
        console.error('[LUBA Boot] Module script load error for ' + s.src, err);
        var vp = document.getElementById('main-viewport');
        if (vp) {
          vp.innerHTML = '<div style="margin:24px 0;padding:20px;background:#fef2f2;border:2px solid #ef4444;border-radius:12px;color:#991b1b;font-family:sans-serif;">' +
            '<h3 style="font-weight:bold;margin:0 0 8px 0;font-size:15px;">Application Script Load Notice</h3>' +
            '<p style="margin:0 0 10px 0;font-size:12px;">The browser could not load <code>' + s.src + '</code>. Please verify that the server is running on port 4000 or Apache.</p>' +
            '<button onclick="location.reload()" style="background:#b91c1c;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;">Retry Reload</button>' +
            '</div>';
        }
      };
      document.body.appendChild(s);
    })();
  </script>
</body>

</html>
