<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUBA CanFindIT · Malolos City LGU Road Operations Admin System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/config/tailwind.config.js"></script>
  <link rel="stylesheet" href="/css/luba-reference.css" />
</head>

<body class="bg-luba-canvas text-luba-textPrimary font-sans antialiased min-h-screen flex">

  <!-- Shared Component: Fixed Left Sidebar (236px · var(--luba-navy) · Full Height) -->
  <aside id="app-sidebar"
    class="luba-sidebar w-sidebar min-h-screen bg-luba-navy text-white flex flex-col justify-start px-4 py-6 shrink-0 select-none">
    <div class="space-y-6">
      <!-- Brand Logo (Cropped directly from Admin · Operations overview.png) -->
      <div class="px-1 pt-0.5 cursor-pointer" data-screen-jump="1">
        <img src="/assets/luba-logo.png" alt="LUBA CanFindIT" class="h-[52px] w-auto object-contain" />
      </div>

      <!-- LGU Workspace Selector -->
      <div class="px-2 space-y-1">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-luba-sidebarMuted">Malolos City LGU WORKSPACE
        </p>
        <p class="text-xs text-luba-sidebarText flex items-center gap-1.5">
          <span>Malolos City</span>
          <svg class="w-3 h-3 text-luba-sidebarMuted" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
          </svg>
        </p>
      </div>

      <!-- Primary Navigation (7 items matching the PNG sidebar 1:1) -->
      <nav class="space-y-1.5" aria-label="Main Navigation">
        <button type="button" data-nav-section="overview" class="luba-nav-btn luba-nav-btn-active">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="overview" class="w-4 h-4 text-luba-cta shrink-0" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
            </svg>
            <span>Overview</span>
          </span>
        </button>

        <button type="button" data-nav-section="reports" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="reports" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none"
              stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" />
              <rect x="9" y="3" width="6" height="4" rx="1" />
              <path d="M9 12h6M9 16h4" />
            </svg>
            <span>Reports</span>
          </span>
          <span class="text-[11px] font-semibold text-luba-cta">98</span>
        </button>

        <button type="button" data-nav-section="map" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="map" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none" stroke="currentColor"
              stroke-width="1.8" viewBox="0 0 24 24">
              <path
                d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
            <span>Pothole map</span>
          </span>
        </button>

        <button type="button" data-nav-section="users" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="users" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none" stroke="currentColor"
              stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
            </svg>
            <span>Users</span>
          </span>
        </button>

        <button type="button" data-nav-section="teams" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="teams" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none" stroke="currentColor"
              stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M2 18h20M4 18v-5a8 8 0 0116 0v5M10 8V5a2 2 0 014 0v3" />
            </svg>
            <span>Teams</span>
          </span>
        </button>

        <button type="button" data-nav-section="analytics" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="analytics" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none"
              stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M3 3v18h18" />
              <path d="M7 16v-4m5 4V8m5 8v-6" />
            </svg>
            <span>Analytics</span>
          </span>
        </button>

        <button type="button" data-nav-section="settings" class="luba-nav-btn">
          <span class="flex items-center gap-3">
            <svg data-nav-icon="settings" class="w-4 h-4 text-luba-sidebarIcon shrink-0" fill="none"
              stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <circle cx="9" cy="8" r="2" />
              <circle cx="15" cy="16" r="2" />
              <path d="M4 8h3m4 0h9M4 16h9m4 0h3" />
            </svg>
            <span>Settings</span>
          </span>
        </button>
      </nav>

      <!-- Sidebar Tagline & Demo Note (Positioned directly under Settings as in all 26 PNGs) -->
      <div class="px-2 pt-5 space-y-4 text-[11px] text-luba-sidebarMuted leading-[1.55]">
        <p>Built for better roads.<br />One connected workflow from<br />report to verified repair.</p>
        <p class="uppercase tracking-wider text-[10px] text-luba-sidebarMuted">DEMO · SAMPLE DATA</p>
      </div>
    </div>
  </aside>

  <!-- Right Shell Column (Top Header Bar 80px + Main Viewport + Footer) -->
  <div id="app-shell-right" class="flex-1 flex flex-col min-w-0 bg-luba-canvas">

    <!-- Shared Component: Top Header Bar (80px · var(--luba-surface) · Matches PNGs 1:1) -->
    <header id="app-topbar"
      class="luba-topbar h-topbar bg-luba-surface border-b border-luba-border px-8 flex items-center justify-between shrink-0">
      <div id="topbar-breadcrumb" class="text-[13px] text-luba-textSubtle flex items-center">
        <span>Administration</span>
        <span class="mx-2">/</span>
        <span>Overview</span>
      </div>

      <div class="flex items-center gap-5">
        <span class="text-[13px] text-luba-textSubtle">Quezon City · PHT</span>

        <button type="button" data-screen-jump="25" aria-label="Notifications"
          class="text-luba-textPrimary hover:text-luba-info transition">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 01-3.46 0" />
          </svg>
        </button>

        <button type="button" data-screen-jump="25"
          class="flex items-center gap-3 text-left hover:opacity-80 transition">
          <div>
            <p class="text-[13px] font-bold text-luba-textPrimary leading-tight">Ana Dela Cruz</p>
            <p class="text-xs font-semibold text-luba-textPrimary leading-tight mt-0.5">LGU administrator</p>
          </div>
          <svg class="w-3.5 h-3.5 text-luba-textPrimary ml-0.5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area (1200px max width, 32px horizontal padding matching 1440px PNG frame) -->
    <main id="app-main-container" class="flex-1 max-w-[1204px] w-full mx-auto px-8 pt-7 pb-6">
      <div id="reference-image-panel" class="mb-6 hidden"></div>
      <div id="main-viewport"></div>
    </main>

    <!-- Footer (Matches bottom metadata row in the 26 PNG screens) -->
    <footer id="app-footer"
      class="max-w-[1204px] w-full mx-auto px-8 py-4 flex flex-wrap items-center justify-between gap-2 text-[11px] text-luba-textSubtle">
      <span>LUBA canFindIT · Quezon City Engineering Department · Fictional demonstration data</span>
      <span id="footer-operational-badge" class="inline-flex items-center gap-1.5 text-luba-success font-medium">
        <span class="w-2 h-2 rounded-full bg-luba-success"></span>
        All systems operational
      </span>
    </footer>
  </div>

  <!-- Full-Screen Uploaded PNG Viewer Container -->
  <div id="full-png-stage" class="hidden flex-1 bg-luba-canvas overflow-auto"></div>

  <!-- Modal Portal -->
  <div id="modal-portal"></div>

  <script type="module" src="/js/app.js"></script>
</body>

</html>
